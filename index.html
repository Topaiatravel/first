// ── VISA-FREE LOGIC ───────────────────────────────────────────
function isNationalityEligible(policy, nationalityCode) {
  if (Array.isArray(policy.eligibleNationalities)) {
    return policy.eligibleNationalities.includes(nationalityCode);
  }
  // For "MOST", "BROAD", "VERY_BROAD" etc, we check by exclusion
  const group = Object.values(NATIONALITY_GROUPS).find(g => g.countries.includes(nationalityCode));
  if (!group) return false;
  
  if (policy.eligibleNationalities === "MOST" || policy.eligibleNationalities === "VERY_BROAD" || policy.eligibleNationalities === "BROAD") {
    return true; // Most nationalities eligible, show with caveats
  }
  if (policy.eligibleNationalities === "MOST_VISA_EXEMPT") {
    return group.passportPower === "high" || group.passportPower === "medium";
  }
  if (policy.eligibleNationalities === "VISA_EXEMPT") {
    return group.passportPower === "high";
  }
  if (policy.eligibleNationalities === "CONDITIONAL") {
    return true; // Show with conditions
  }
  return false;
}

  return TRANSIT_POLICIES
    .filter(p => p.active)
    .filter(p => isNationalityEligible(p, nationalityCode))
    .filter(p => !connectionAirport || p.airportIata.includes(connectionAirport))
    .map(p => ({
      ...p,
      certainty: Array.isArray(p.eligibleNationalities) && p.eligibleNationalities.includes(nationalityCode)
        ? "confirmed" : "likely",
      nationalityNote: getSpecificNote(p, nationalityCode)
    }))
    .sort((a, b) => {
      if (a.certainty === "confirmed" && b.certainty !== "confirmed") return -1;
      if (b.certainty === "confirmed" && a.certainty !== "confirmed") return 1;
      return b.maxHours - a.maxHours;
    });
}

function getSpecificNote(policy, natCode) {
  if (natCode === "AM") {
    const notes = {
      "sgp-vftf-cis": "✅ Armenia è inclusa come paese CIS. Eleggibile per VFTF 96h.",
      "chn-240h": "✅ Armenia non è nella lista dei 55 paesi per il 240h TWOV.",
      "chn-24h": "⚠️ Verificare eleggibilità specifica. 24h TWOV generalmente disponibile.",
      "tur-transit": "⚠️ eVisa necessario per uscire dall'aeroporto. Transito airside OK.",
      "hkg-transit": "✅ Armeni visa-free per 14 giorni a Hong Kong.",
      "uae-transit": "⚠️ Armeni: eVisa necessario per UAE.",
      "qat-transit": "⚠️ Verificare status visa on arrival per armeni.",
    };
    return notes[policy.id] || null;
  }
  return null;
}

function findFamilyTransitOptions(nationalities, connectionAirport = null) {
  if (nationalities.length === 0) return [];
  
  const optionsByNat = nationalities.map(nat => ({
    nationality: nat,
    options: findTransitOptions(nat, connectionAirport)
  }));
  
  // Find intersection - policies that work for ALL family members
  const allPolicyIds = optionsByNat[0].options.map(o => o.id);
  const commonIds = allPolicyIds.filter(id =>
    optionsByNat.every(natOpts => natOpts.options.some(o => o.id === id))
  );
  
  return {
    commonOptions: commonIds.map(id => {
      const base = optionsByNat[0].options.find(o => o.id === id);
      const perNat = optionsByNat.map(no => ({
        nationality: no.nationality,
        detail: no.options.find(o => o.id === id)
      }));
      return { ...base, perNationality: perNat };
    }),
    perNationality: optionsByNat
  };
}

// ── STOPOVER LOGIC ────────────────────────────────────────────
const HUB_IATA_SET = new Set();
STOPOVER_PROGRAMS.forEach(p => {
  p.hubIata.split(",").forEach(code => HUB_IATA_SET.add(code.trim()));
});

function getProgramsByHub(iataCode) {
  return STOPOVER_PROGRAMS.filter(p =>
    p.active && p.hubIata.split(",").map(c => c.trim()).includes(iataCode)
  );
}

// ── SCORING ENGINE ──────────────────────────────────────────
function calculateStopoverScore(program, flightData = {}) {
  const cabin = flightData.cabin || "economy";
  let score = 0;
  const breakdown = {};

  // 1. Hotel value (0-40 points)
  const hotelValue = program.estimatedValueEur[cabin] || program.estimatedValueEur.economy || 0;
  breakdown.hotelValue = Math.min(40, Math.round(hotelValue / 8));
  score += breakdown.hotelValue;

  // 2. Tier bonus (0-25 points)
  breakdown.tierBonus = program.tier === 1 ? 25 : program.tier === 2 ? 15 : 5;
  score += breakdown.tierBonus;

  // 3. Flexibility (0-15 points) — more max nights = more flexible
  breakdown.flexibility = Math.min(15, Math.round((program.maxNights || 1) * 2));
  score += breakdown.flexibility;

  // 4. Ease of booking (0-10 points)
  breakdown.easeOfBooking = program.advanceBookingDays === 0 ? 10 : program.advanceBookingDays <= 1 ? 7 : 4;
  score += breakdown.easeOfBooking;

  // 5. Additional perks count (0-10 points)
  breakdown.perksBonus = Math.min(10, (program.additionalPerks?.length || 0) * 2);
  score += breakdown.perksBonus;

  return { score: Math.min(100, score), breakdown, estimatedSavingsEur: hotelValue };
}

// ── MATCHING ENGINE ─────────────────────────────────────────
function findStopoverOpportunities(origin, destination, connectionHub, layoverHours, cabin) {
  const programs = getProgramsByHub(connectionHub);
  return programs
    .filter(p => layoverHours >= p.minLayoverHours && (p.maxHours === null || layoverHours <= p.maxHours))
    .map(p => ({
      ...p,
      scoring: calculateStopoverScore(p, { cabin }),
      layoverHours
    }))
    .sort((a, b) => b.scoring.score - a.scoring.score);
}

  function addDays(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().split("T")[0];
  }

  function fmtDate(s) {
    if (!s) return "—";
    return new Date(s + "T12:00:00").toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long" });
  }

  function parseTime(str) {
    if (!str) return "—";
    const m = str.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if (!m) return str;
    let h = parseInt(m[1]);
    if (m[3].toUpperCase() === "PM" && h !== 12) h += 12;
    if (m[3].toUpperCase() === "AM" && h === 12) h = 0;
    return `${String(h).padStart(2,"0")}:${m[2]}`;
  }

  function isEveningDep(timeStr) {
    const t = parseTime(timeStr);
    const h = parseInt(t.split(":")[0]);
    // Fascia notturna: 19:00-23:59 e 00:00-02:00 (mezzanotte/alba)
    return h >= 19 || h <= 2;
  }

  // Mese corrente e successivo per le query Ryanair
  function currentMonths(windowDays) {
    const months = new Set();
    for (let i = 2; i <= Math.min(windowDays, 90); i += 20) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      months.add(d.toISOString().slice(0, 7)); // YYYY-MM
    }
    return [...months].slice(0, 3);
  }

  // Giorno della settimana (0=dom,1=lun,...,6=sab)
  function weekday(dateStr) {
    return new Date(dateStr + "T12:00:00").getDay();
  }

  // Verifica se la combinazione dep→ret è una coppia "economica"
  // Giovedì→Lunedì, Giovedì→Martedì, Martedì→Sabato, Mercoledì→Domenica
  function isCheapCombo(depDate, retDate) {
    const dep = weekday(depDate);
    const ret = weekday(retDate);
    return (dep === 4 && (ret === 1 || ret === 2)) || // Gio→Lun, Gio→Mar
           (dep === 2 && ret === 6) ||                 // Mar→Sab
           (dep === 3 && ret === 0);                   // Mer→Dom
  }

  // ── Ryanair cheapestPerDay (gratuito, no SerpApi) ─────────────────────────
  async function fetchRyanairCheapest(from, dest, months, selectedNights, budget) {
    const results = [];
    for (const month of months) {
      try {
        const res = await Promise.race([
          fetch(`/api/ryanair?from=${from}&to=${dest.code}&month=${month}`),
          new Promise((_,rej) => setTimeout(() => rej(new Error("timeout")), 10000))
        ]);
        if (!res.ok) continue;
        const data = await res.json();
        if (data.noRoute || !data.outbound?.length) continue;

        // Costruisce combinazioni andata+ritorno rispettando durata selezionata
        for (const out of data.outbound) {
          if (!out.price || out.price > budget) continue;
          for (const nights of selectedNights) {
            const retDate = addDays(
              Math.round((new Date(out.date) - new Date()) / (1000*60*60*24)) + nights
            );
            // Cerca il prezzo di ritorno per quella data
            const inboundDay = data.inbound?.find(d => d.date === retDate);
            if (!inboundDay || !inboundDay.price) continue;
            const totalPrice = Math.round(out.price + inboundDay.price);
            if (totalPrice > budget) continue;

            results.push({
              mode: "any",
              source: "ryanair",
              destination: dest.city, country: dest.country, flag: dest.flag,
              destCode: dest.code, zone: dest.zone || "",
              total_price: totalPrice,
              outPrice: Math.round(out.price),
              retPrice: Math.round(inboundDay.price),
              hotel_nights_saved: 0,
              depDate: out.date, retDate,
              nights,
              isCheapCombo: isCheapCombo(out.date, retDate),
              depTime: "—", arrTime: "—",
              airline: "Ryanair", stops: 0, dur: "—",
              flightH: null,
              trip_link: buildTripLink(from, dest.code, out.date, retDate),
              google_link: buildGoogleLink(from, dest.code, out.date, retDate),
              ryanair_link: `https://www.ryanair.com/it/it/trip/flights/select?adults=1&teens=0&children=0&infants=0&dateOut=${out.date}&dateIn=${retDate}&isConnectedFlight=false&isReturn=true&discount=0&promoCode=&originIata=${from}&destinationIata=${dest.code}&tpAdults=1&tpTeens=0&tpChildren=0&tpInfants=0&tpStartDate=${out.date}&tpEndDate=${retDate}&tpDiscount=0&tpPromoCode=&tpOriginIata=${from}&tpDestinationIata=${dest.code}`,
            });
          }
        }
      } catch(e) {
        // rotta non disponibile, skippa
      }
    }
    return results;
  }

  // ── Wizz Air timetable (gratuito, no SerpApi) ───────────────────────────
  async function fetchWizzairCheapest(from, dest, months, selectedNights, budget) {
    const results = [];
    for (const month of months) {
      try {
        const res = await Promise.race([
          fetch(`/api/wizzair?from=${from}&to=${dest.code}&month=${month}`),
          new Promise((_,rej) => setTimeout(() => rej(new Error("timeout")), 12000))
        ]);
        if (!res.ok) continue;
        const data = await res.json();
        if (data.noRoute || !data.flights?.length) continue;

        // Per ogni volo andata, cerca un ritorno compatibile con le notti selezionate
        for (const outFlight of data.flights) {
          if (!outFlight.price || outFlight.price > budget * 0.7) continue; // andata max 70% budget

          for (const nights of selectedNights) {
            const retDateObj = new Date(outFlight.depDate + "T12:00:00");
            retDateObj.setDate(retDateObj.getDate() + nights);
            const retDate = retDateObj.toISOString().split("T")[0];

            // Cerca volo di ritorno nella stessa lista (stesso mese)
            const retFlight = data.flights.find(f =>
              f.depDate === retDate && f.price
            );

            // Se il ritorno non è nello stesso mese, stima con media
            const retPrice = retFlight
              ? retFlight.price
              : Math.round(data.flights.reduce((s,f) => s + f.price, 0) / data.flights.length);

            const totalPrice = outFlight.price + retPrice;
            if (totalPrice > budget) continue;

            results.push({
              mode: "any",
              source: "wizzair",
              destination: dest.city, country: dest.country, flag: dest.flag,
              destCode: dest.code, zone: dest.zone || "",
              total_price: Math.round(totalPrice),
              outPrice: outFlight.price,
              retPrice: Math.round(retPrice),
              hotel_nights_saved: 0,
              depDate: outFlight.depDate,
              retDate,
              nights,
              isCheapCombo: isCheapCombo(outFlight.depDate, retDate),
              depTime: outFlight.depTime || "—",
              arrTime: outFlight.arrTime || "—",
              airline: "Wizz Air", stops: 0,
              dur: outFlight.duration || "—",
              flightH: null,
              trip_link: buildTripLink(from, dest.code, outFlight.depDate, retDate),
              google_link: buildGoogleLink(from, dest.code, outFlight.depDate, retDate),
              wizzair_link: `https://www.wizzair.com/it-it/prenotazione/seleziona-volo/${from}/${dest.code}/${outFlight.depDate}/${retDate}/1/0/0`,
            });
          }
        }
      } catch(e) {
        // rotta non disponibile
      }
    }
    // Dedup per data — tieni solo il più economico per ogni combinazione dep+nights
    const seen = {};
    return results
      .sort((a,b) => a.total_price - b.total_price)
      .filter(r => {
        const k = r.depDate + r.nights;
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      });
  }

  // ── SerpApi (overnight e fallback) ────────────────────────────────────────
  async function fetchSerpRoute(from, dest, depDate, retDate, mode) {
    const p = new URLSearchParams({
      departure_id: from, arrival_id: dest.code,
      outbound_date: depDate, return_date: retDate,
      currency: "EUR", hl: "it", type: "1",
    });
    // Fascia notturna 19:00-23:59 via API; 00:00-02:00 filtrato lato client
    if (mode === "overnight" || mode === "one_overnight") p.set("outbound_times", "19,23");
    if (mode === "overnight") p.set("return_times", "19,23");

    const res = await Promise.race([
      fetch("/api/search?" + p),
      new Promise((_,rej) => setTimeout(() => rej(new Error("Timeout")), 20000))
    ]);
    if (!res.ok) {
      const txt = await res.text().catch(()=>"");
      let msg = "HTTP " + res.status;
      try { msg = JSON.parse(txt).error || msg; } catch {}
      throw new Error(dest.code + ": " + msg);
    }
    const data = await res.json();
    if (data.error) throw new Error("API: " + data.error);
    return data;
  }

  function mapSerpFlight(flight, from, dest, depDate, retDate, mode) {
    const price = flight.price;
    if (!price) return null;
    const leg = flight.flights?.[0] || {};
    const depTime = parseTime(leg.departure_airport?.time);
    const arrTime = parseTime(leg.arrival_airport?.time);
    const airline = leg.airline || "—";
    const stops = flight.layovers?.length || 0;
    const dur = flight.total_duration
      ? `${Math.floor(flight.total_duration/60)}h ${flight.total_duration%60}m` : "—";
    if ((mode === "overnight" || mode === "one_overnight") && !isEveningDep(leg.departure_airport?.time)) return null;
    const hotelSaved = mode === "overnight" ? 2 : mode === "one_overnight" ? 1 : 0;
    const nights = Math.round((new Date(retDate) - new Date(depDate)) / (1000*60*60*24));
    return {
      mode, source: "serp",
      destination: dest.city, country: dest.country, flag: dest.flag,
      zone: dest.zone || "", destCode: dest.code,
      total_price: price, hotel_nights_saved: hotelSaved,
      isCheapCombo: isCheapCombo(depDate, retDate),
      depTime, arrTime, airline, stops, dur, depDate, retDate, nights,
      flightH: dest.h || null,
      trip_link: buildTripLink(from, dest.code, depDate, retDate),
      google_link: buildGoogleLink(from, dest.code, depDate, retDate),
    };
  }

  function pickDatesForNights(selectedNights, windowDays) {
    const nights = selectedNights[Math.floor(Math.random() * selectedNights.length)];
    const maxOffset = Math.max(3, windowDays - nights - 1);
    const offset = Math.floor(Math.random() * maxOffset) + 2;
    return { depDate: addDays(offset), retDate: addDays(offset + nights), nights };
  }

          .filter(Boolean)
          .sort(() => Math.random() - 0.5)
          .slice(0, 8); // max 8 rotte Ryanair

        const ryanairResults = await Promise.allSettled(
          ryanairDests.map(dest => fetchRyanairCheapest(from, dest, months, selectedNights, budget))
        );
        ryanairResults.forEach(r => {
          if (r.status === "fulfilled") r.value.forEach(card => results.push(card));
        });


        const wizzDests = (WIZZAIR_ROUTES[from] || WIZZAIR_ROUTES["FCO"])
          .map(code => {
            // Cerca prima in BUDGET_DESTINATIONS, poi crea entry minimale
            const known = BUDGET_DESTINATIONS.find(d => d.code === code);
            return known || { code, city: code, country: "—", flag: "✈" };
          })
          .filter(d => !ryanairDests.find(r => r.code === d.code)) // no duplicati con Ryanair
          .sort(() => Math.random() - 0.5)
          .slice(0, 6);

        const wizzResults = await Promise.allSettled(
          wizzDests.map(dest => fetchWizzairCheapest(from, dest, months, selectedNights, budget))
        );
        wizzResults.forEach(r => {
          if (r.status === "fulfilled") r.value.forEach(card => results.push(card));
        });


        // Usa le stesse destinazioni già cercate + alcune extra non coperte da Ryanair/Wizz
        const aviasalesDests = BUDGET_DESTINATIONS
          .sort(() => Math.random() - 0.5)
          .slice(0, 6);

        const aviasalesResults = await Promise.allSettled(
          aviasalesDests.map(dest => fetchAviasalesCheapest(from, dest, months, selectedNights, budget))
        );
        aviasalesResults.forEach(r => {
          if (r.status === "fulfilled") r.value.forEach(card => results.push(card));
        });

        // Fallback SerpApi solo per destinazioni senza nessuna copertura (1-2 call)
        const coveredCodes = new Set([
          ...ryanairDests.map(d => d.code),
          ...wizzDests.map(d => d.code),
          ...aviasalesDests.map(d => d.code),
        ]);
        const uncovered = BUDGET_DESTINATIONS
          .filter(d => !coveredCodes.has(d.code))
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);

        if (uncovered.length) {
  
          const serpResults = await Promise.allSettled(
            uncovered.map(dest => {
              const { depDate, retDate } = pickDatesForNights(selectedNights, windowDays);
              return fetchSerpRoute(from, dest, depDate, retDate, "any")
                .then(data => ({ data, dest, depDate, retDate }));
            })
          );
          serpResults.forEach(r => {
            if (r.status !== "fulfilled") return;
            const { data, dest, depDate, retDate } = r.value;
            [...(data.best_flights||[]), ...(data.other_flights||[])].slice(0,2).forEach(f => {
              const card = mapSerpFlight(f, from, dest, depDate, retDate, "any");
              if (card && card.total_price <= budget) results.push(card);
            });
          });
        }

      } else {
        // ── Modalità overnight: usa SerpApi (5 call) ──
        const pool = OVERNIGHT_DESTINATIONS[from] || OVERNIGHT_DESTINATIONS["FCO"];
        const dests = [...pool].sort(() => Math.random() - 0.5).slice(0, 5);

        for (let i = 0; i < dests.length; i += 3) {
          const batch = dests.slice(i, i + 3);
          const datePairs = batch.map(() => pickDatesForNights(selectedNights, windowDays));
          const responses = await Promise.allSettled(
            batch.map((dest, idx) => fetchSerpRoute(from, dest, datePairs[idx].depDate, datePairs[idx].retDate, mode))
          );
          let firstErr = null;
          responses.forEach((r, idx) => {
            if (r.status === "rejected") { if (!firstErr) firstErr = r.reason; return; }
            const { depDate, retDate } = datePairs[idx];
            [...(r.value.best_flights||[]), ...(r.value.other_flights||[])].slice(0,2).forEach(f => {
              const card = mapSerpFlight(f, from, batch[idx], depDate, retDate, mode);
              if (card && card.total_price <= budget) results.push(card);
            });
          });
          if (firstErr && results.length === 0 && i === 0) throw firstErr;
          if (i + 3 < dests.length) await new Promise(r => setTimeout(r, 400));
        }
      }
    }

    // Dedup per destCode+mode, ordina per prezzo
    const seen = {};
    return results
      .filter(r => { const k = r.destCode+r.mode+r.depDate; if(seen[k]) return false; seen[k]=true; return true; })
      .sort((a, b) => a.total_price - b.total_price)
      .slice(0, 20); // max 20 risultati
  }

  // ── Hotellook: prezzi hotel per destinazione ─────────────────────────────
  async function fetchHotelPrices(destCode, depDate, retDate) {
    try {
      const res = await Promise.race([
        fetch(`/api/hotels?city=${destCode}&checkIn=${depDate}&checkOut=${retDate}`),
        new Promise((_,rej) => setTimeout(() => rej(new Error("timeout")), 12000))
      ]);
      if (!res.ok) return null;
      const data = await res.json();
      if (data.noData || !data.hotels?.length) return null;
      return data;
    } catch(e) { return null; }
  }

  // ── Bot detection + client fingerprint ──────────────────────────────────
  // Rileva bot elementari: nessun mouse movement, submit istantaneo, ecc.
  const _botSignals = { mouseCount: 0, keyCount: 0, startTime: Date.now() };
  if (typeof window !== "undefined") {
    document.addEventListener("mousemove", () => { _botSignals.mouseCount++; }, { passive: true });
    document.addEventListener("keydown",   () => { _botSignals.keyCount++;   }, { passive: true });
  }
  function isSuspiciousBot() {
    const elapsed = Date.now() - _botSignals.startTime;
    // Meno di 2 secondi sulla pagina + nessun movimento mouse = sospetto
    if (elapsed < 2000 && _botSignals.mouseCount === 0 && _botSignals.keyCount === 0) return true;
    // Meno di 500ms = impossibile per un umano
    if (elapsed < 500) return true;
    return false;
  }

  const TIER_CONFIG = {
    free:       { label:"Free",    daily:1,  color:"#6b7280", bg:"#f3f4f6" },
    registered: { label:"Account", daily:3,  color:"#0369a1", bg:"#e0f2fe" },

  function getUserTier() {
    try {
      const token = localStorage.getItem("topaia_token");
      if (!token) return { tier:"free", token:"" };
      const decoded = atob(token);
      const [tier] = decoded.split(":");
      if (!TIER_CONFIG[tier]) return { tier:"free", token:"" };
      return { tier, token };
    } catch { return { tier:"free", token:"" }; }
  }

  function App() {
    const { lang, t, toggleLang } = useLang();
    const [from, setFrom] = useState("FCO");
    const [budget, setBudget] = useState(500);
    const [selectedNights, setSelectedNights] = useState([4, 5, 7]);
    const [window_, setWindow] = useState(WINDOWS[1]);
    const [modes, setModes] = useState(["overnight"]);
    const [activeTab, setActiveTab] = useState("search");
    const [explorerMode, setExplorerMode] = useState(false);
    const [nationalities, setNationalities] = useState(["IT"]);
    const [results, setResults] = useState(null);
    const [loading, setLoading] = useState(false);
    const [loadMsg, setLoadMsg] = useState("");
    const [loadStep, setLoadStep] = useState(0);
    const [loadTotal, setLoadTotal] = useState(1);
    const [error, setError] = useState(null);

    const toggleMode = id =>
      setModes(p => p.includes(id) ? p.filter(m=>m!==id) : [...p, id]);
    const toggleNight = n =>
      setSelectedNights(p => p.includes(n) ? (p.length>1 ? p.filter(x=>x!==n) : p) : [...p, n].sort((a,b)=>a-b));

    // Stima call SerpApi: overnight=5/mode, "any"=3 (Ryanair gratis + 3 fallback)
    const callEst = modes.reduce((sum, m) => sum + (m === "any" ? 3 : 5), 0);
    const ryanairActive = modes.includes("any");
    const destCount = modes.some(m => m==="overnight"||m==="one_overnight")
      ? (OVERNIGHT_DESTINATIONS[from]||[]).length : BUDGET_DESTINATIONS.length;

    const [rateInfo, setRateInfo] = useState(null);
    const [showUpgrade, setShowUpgrade] = useState(false);
    const [userTierInfo] = useState(() => getUserTier()); // { tier, token }
    const tierCfg = TIER_CONFIG[userTierInfo.tier] || TIER_CONFIG.free;

    const search = async () => {
      if (!modes.length || !selectedNights.length) return;
      setLoading(true); setResults(null); setError(null);

      // ── Bot detection (client-side) ─────────────────────────────────────
      if (isSuspiciousBot()) {
        setError("Rilevato comportamento anomalo. Attendi un momento e riprova.");
        setLoading(false);
        return;
      }

      // ── Rate limit check ────────────────────────────────────────────────
      try {
        const rlRes = await fetch("/api/rate-check", {
          method: "POST",
          headers: { "X-User-Token": userTierInfo.token || "" },
        });
        const rl = await rlRes.json();
        if (!rl.allowed) {
          setLoading(false);
          if (rl.reason === "daily" || rl.reason === "hourly") {
            setShowUpgrade(true); // mostra modal upgrade
          } else {
            setError("⏳ " + (rl.message || "Troppe ricerche. Riprova più tardi."));
          }
          return;
        }
        setRateInfo({
          remainingHour: rl.remainingHour,
          remainingDay: rl.remainingDay,
          dailyLimit: rl.dailyLimit,
          tier: rl.tier,
        });
      } catch(e) {
        // Se il check fallisce per errore di rete, permettiamo la ricerca
        // (fail open: meglio una ricerca in più che bloccare utenti legittimi)
        console.warn("Rate check failed:", e.message);
      }

      // ── Ricerca voli ────────────────────────────────────────────────────
      try {
        const found = await runDiscovery(
          from, budget, selectedNights, window_.days, modes,
          (msg, step, total) => { setLoadMsg(msg); setLoadStep(step); setLoadTotal(total); }
        );
        if (!found.length) {
          setError(t.noResults);
        } else {
          setResults(found);
        }
      } catch(e) {
        setError("Errore: " + e.message);
      } finally {
        setLoading(false);
      }
    };

    const inputStyle = {
      width:"100%", background:C.white, border:`1.5px solid ${C.border}`,
      borderRadius:10, color:C.gray1, padding:"11px 14px",
      fontSize:15, fontFamily:"'Inter',sans-serif", fontWeight:500,
    };

    return (
      <div style={{ minHeight:"100vh", background:C.gray6 }}>

        {/* Upgrade modal */}
        {showUpgrade && (
          <UpgradeModal
            tier={userTierInfo.tier}
            reason="daily"
            onClose={(upgraded) => {
              setShowUpgrade(false);
              if (upgraded) window.location.reload(); // ricarica per applicare nuovo tier
            }}
          />
        )}

        {/* Header + Tab Navigation */}
        <div style={{ background:C.white, borderBottom:`1px solid ${C.border}` }}>
          <div style={{ padding:"12px 16px 0", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:22 }}>🐭</span>
              <div>
                <div style={{ fontFamily:"'Manrope',sans-serif", fontSize:17, fontWeight:800, color:C.gray1 }}>
                  topaia<span style={{ color:C.orange }}>.travel</span>
                </div>
                <div style={{ fontSize:10, color:C.gray3 }}>{t.appTagline}</div>
              </div>
            </div>
            <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>
              {/* Tier badge */}
              <TierBadge tier={userTierInfo.tier}
                remainingDay={rateInfo?.remainingDay}
                dailyLimit={rateInfo?.dailyLimit} />
              {/* Language toggle */}
              <div onClick={toggleLang}
                style={{ display:"flex", alignItems:"center", gap:4, cursor:"pointer",
                  padding:"4px 9px", borderRadius:20,
                  background: C.gray6, border:`1px solid ${C.border}` }}>
                <span style={{ fontSize:13 }}>{t.flag}</span>
                <span style={{ fontSize:11, fontWeight:700, color:C.gray2 }}>{t.lang}</span>
              </div>
              {/* Explorer toggle */}
              <div onClick={() => setExplorerMode(m => !m)} style={{
                display:"flex", alignItems:"center", gap:5, cursor:"pointer",
                padding:"4px 10px", borderRadius:20,
                background: explorerMode ? C.orangeL : C.gray6,
                border:`1px solid ${explorerMode ? C.orange : C.border}`,
                transition:"all 0.2s"
              }}>
                <span style={{ fontSize:13 }}>{explorerMode ? "🧭" : "🔍"}</span>
                <span style={{ fontSize:11, fontWeight:700, color: explorerMode ? C.orange : C.gray3 }}>
                  {explorerMode ? t.explorerOn : t.explorerOff}
                </span>
              </div>
            </div>
          </div>
          <div style={{ display:"flex", gap:0, padding:"0 8px", overflowX:"auto" }}>
            {[
              { id:"search",   label: t.tabFlights  },
              { id:"stopover", label: t.tabStopover },
              { id:"visafree", label: t.tabVisafree },
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                padding:"10px 14px", border:"none", background:"transparent",
                fontSize:13, fontWeight: activeTab===tab.id ? 700 : 500,
                color: activeTab===tab.id ? C.orange : C.gray3,
                borderBottom:`2px solid ${activeTab===tab.id ? C.orange : "transparent"}`,
                cursor:"pointer", whiteSpace:"nowrap", transition:"all 0.15s",
                fontFamily:"'Inter',sans-serif"
              }}>
                {tab.icon} {tab.label}
              </button>
            ))}
          </div>
        </div>

        {/* Tab routing */}
        {activeTab === "stopover" && <StopoverView explorerMode={explorerMode} t={t} />}
        {activeTab === "visafree" && <VisaFreeView explorerMode={explorerMode} t={t} />}

        {activeTab === "search" && (
        <div style={{ maxWidth:680, margin:"0 auto", padding:"18px 14px 60px" }}>

          {/* Offerte vetrina — dal cron ogni 12h */}
          <div style={{ background:C.white, borderRadius:16, marginBottom:14,
            boxShadow:"0 1px 4px rgba(0,0,0,.05)", overflow:"hidden",
            border:`1px solid ${C.border}`, paddingTop:14 }}>
            <DealsWidget onSelectAirport={(code) => {
              setFrom(code);
              setTimeout(() => window.scrollTo({top:0, behavior:"smooth"}), 100);
            }} />
          </div>

          {/* Form */}
          <div style={{ background:C.white, border:`1px solid ${C.border}`,
            borderRadius:20, padding:22, marginBottom:16,
            boxShadow:"0 2px 10px rgba(0,0,0,.05)" }}>

            <div style={{ fontSize:17, fontWeight:800, fontFamily:"'Manrope',sans-serif",
              color:C.gray1, marginBottom:18 }}>Dove puoi andare?</div>

            {/* Riga 1: aeroporto + budget */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:14 }}>
              <div>
                <Label>Parti da</Label>
                <select value={from} onChange={e=>setFrom(e.target.value)} style={inputStyle}>
                  {AIRPORTS.map(a=><option key={a.code} value={a.code}>{a.code} — {lang==="hy" && a.city_hy ? a.city_hy : a.city}</option>)}
                </select>
              </div>
              <div>
                <Label>Budget max volo A/R — <span style={{color:C.orange,fontWeight:800}}>€{budget}</span></Label>
                <input type="range" min={100} max={2000} step={50} value={budget}
                  onChange={e=>setBudget(Number(e.target.value))}
                  style={{ width:"100%", accentColor:C.orange, marginTop:10 }} />
                <div style={{ display:"flex", justifyContent:"space-between",
                  fontSize:11, color:C.gray4, marginTop:3 }}>
                  <span>€100</span><span>€2000</span>
                </div>
              </div>
            </div>

            {/* Notti — multi-select pill */}
            <div style={{ marginBottom:14 }}>
              <Label>Durata del viaggio (scegli una o più)</Label>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:4 }}>
                {NIGHT_OPTIONS.map(n => (
                  <NightPill key={n} n={n} selected={selectedNights.includes(n)} onToggle={toggleNight} />
                ))}
              </div>
              <div style={{ fontSize:12, color:C.gray3, marginTop:6 }}>
                {selectedNights.length === 1
                  ? `Selezionate: ${selectedNights[0]} notti`
                  : `Selezionate: ${selectedNights.join(", ")} notti — ogni destinazione riceverà una durata casuale tra quelle scelte`
                }
              </div>
            </div>

            {/* Finestra */}
            <div style={{ marginBottom:18 }}>
              <Label>Quando</Label>
              <select value={window_.label}
                onChange={e=>setWindow(WINDOWS.find(w=>w.label===e.target.value))} style={inputStyle}>
                {WINDOWS.map(w=><option key={w.label}>{w.label}</option>)}
              </select>
            </div>

            {/* Strategia */}
            <div style={{ marginBottom:16 }}>
              <Label>Strategia di risparmio</Label>
              <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                {MODES.map(m => {
                  const active = modes.includes(m.id);
                  return (
                    <div key={m.id} onClick={()=>toggleMode(m.id)} style={{
                      display:"flex", alignItems:"center", gap:12, padding:"12px 14px",
                      background: active ? m.badgeColor+"0d" : C.gray6,
                      border:`1.5px solid ${active ? m.badgeColor : C.border}`,
                      borderRadius:12, cursor:"pointer", transition:"all 0.15s",
                    }}>
                      <span style={{ fontSize:20 }}>{m.emoji}</span>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:active?C.gray1:C.gray2, marginBottom:2 }}>
                          {m.label}
                        </div>
                        <div style={{ fontSize:12, color:C.gray3 }}>{m.desc}</div>
                      </div>
                      <div style={{ width:20, height:20, borderRadius:5, flexShrink:0,
                        border:`2px solid ${active?m.badgeColor:C.gray5}`,
                        background:active?m.badgeColor:C.white,
                        display:"flex", alignItems:"center", justifyContent:"center" }}>
                        {active&&<span style={{color:"#fff",fontSize:12}}>✓</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Info call */}
            <div style={{ background:C.gray6, border:`1px solid ${C.border}`,
              borderRadius:9, padding:"9px 13px", marginBottom:14,
              fontSize:12, color:C.gray3, lineHeight:1.6 }}>
              <span>ℹ️ Ricerca su più fonti · ogni ricerca usa ~<strong>{callEst}</strong> query disponibili</span>
              {rateInfo && rateInfo.remainingDay <= 2 && (
                <span style={{ marginLeft:6, fontSize:11,
                  color: rateInfo.remainingDay === 0 ? "#b91c1c" : "#92400e",
                  fontWeight:600 }}>
                  · {rateInfo.remainingDay} ricerche rimaste oggi
                  {rateInfo.remainingDay === 0 && (
                    <button onClick={() => setShowUpgrade(true)}
                      style={{ marginLeft:6, padding:"1px 7px", borderRadius:8,
                        background:"#7c3aed", color:"#fff", border:"none",
                        fontSize:10, fontWeight:700, cursor:"pointer" }}>
                      Upgrade
                    </button>
                  )}
                </span>
              )}
              <span> · {destCount} destinazioni per {from}</span>
            </div>

            <button onClick={search} disabled={loading||!modes.length} style={{
              width:"100%", padding:"15px", border:"none", borderRadius:11,
              background:loading||!modes.length ? C.gray5 : C.orange,
              color:loading||!modes.length ? C.gray4 : C.white,
              fontSize:15, fontWeight:800, fontFamily:"'Manrope',sans-serif",
              cursor:loading||!modes.length?"not-allowed":"pointer", transition:"all 0.2s",
              boxShadow:loading||!modes.length?"none":"0 3px 12px rgba(232,93,0,.3)",
            }}>
              {loading ? "Ricerca in corso..." : "🔍 Trova le migliori opportunità"}
            </button>
          </div>

          {/* Loading */}
          {loading && (
            <div style={{ background:C.white, border:`1px solid ${C.border}`,
              borderRadius:16, padding:"28px 22px", textAlign:"center",
              boxShadow:"0 2px 10px rgba(0,0,0,.05)" }}>
              <div style={{ width:44, height:44, border:`3px solid ${C.gray5}`,
                borderTop:`3px solid ${C.orange}`, borderRadius:"50%",
                animation:"spin 0.8s linear infinite", margin:"0 auto 14px" }} />
              <div style={{ fontSize:14, fontWeight:600, color:C.gray1, marginBottom:5 }}>
                {[t.loading1, t.loading2, t.loading3, t.loading4][Math.min(loadStep - 1, 3)] || t.btnSearching}
              </div>
              <div style={{ fontSize:12, color:C.gray3, marginBottom:12 }}>
                {loadStep < loadTotal ? "Ricerca in corso..." : "Elaborazione risultati..."}
              </div>
              <div style={{ background:C.gray5, borderRadius:8, height:5, overflow:"hidden" }}>
                <div style={{ height:"100%", background:C.orange, borderRadius:8,
                  width:`${Math.round((loadStep/loadTotal)*100)}%`, transition:"width 0.4s" }} />
              </div>
            </div>
          )}

          {/* Errore */}
          {error && (
            <div style={{ background:"#fff5f5", border:"1.5px solid #fecaca",
              borderRadius:13, padding:"16px 18px", color:"#b91c1c",
              fontSize:13, fontWeight:500, lineHeight:1.6 }}>
              ⚠️ {error}
            </div>
          )}

          {/* Risultati */}
          {results && (
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:12 }}>
                <div style={{ fontSize:17, fontWeight:800, fontFamily:"'Manrope',sans-serif", color:C.gray1 }}>
                  {t.resultsFound(results.length)}
                </div>
                <div style={{ fontSize:12, color:C.gray3 }}>ordinate per prezzo</div>
              </div>
              {results.map((r,i) => <FlightCard key={i} r={r} index={i} />)}
              <div style={{ marginTop:14, padding:"12px 14px", background:C.white,
                border:`1px solid ${C.border}`, borderRadius:11,
                fontSize:11, color:C.gray4, textAlign:"center", lineHeight:1.7 }}>
                Dati Google Flights via SerpApi · Booking via Trip.com · Prezzi live
              </div>
            </div>
          )}
        </div>
        )} {/* end search tab */}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
